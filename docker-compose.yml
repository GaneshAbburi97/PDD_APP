version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: tmd_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tmd_db
      MYSQL_USER: tmd_user
      MYSQL_PASSWORD: tmd_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mysql_data:
