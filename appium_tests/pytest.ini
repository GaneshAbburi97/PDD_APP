[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    auth: unauthenticated login/signup/reset screen coverage
    e2e: authenticated end-to-end mobile journey coverage
    requires_credentials: needs TMD_TEST_EMAIL and TMD_TEST_PASSWORD
    navigation: app navigation and screen reachability
    tracking: pain, wellness, sleep, and exercise tracking flows
    reports: report and progress screens
    support: profile, support, doctors, and related screens
