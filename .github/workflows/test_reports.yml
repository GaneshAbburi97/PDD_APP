name: Generate Excel Reports

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f appium_tests/requirements.txt ]; then pip install -r appium_tests/requirements.txt; fi
          pip install pandas openpyxl

      - name: Run Report Generation Script
        run: |
          python appium_tests/generate_mock_report.py
        
      - name: Upload Excel Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tmd-excel-reports
          path: appium_tests/reports/*.xlsx
          retention-days: 14
