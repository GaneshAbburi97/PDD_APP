name: Android and Appium Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Android & Appium Tests
    # macOS runners have HAXM / hardware acceleration which makes the Android Emulator much faster
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android Debug and Test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Install Appium and UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Python Appium Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f appium_tests/requirements.txt ]; then pip install -r appium_tests/requirements.txt; fi

      - name: Run Instrumented and Appium Tests in Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Running Android Instrumented Tests..."
            ./gradlew connectedDebugAndroidTest
            
            echo "Starting Appium Server..."
            appium --log-timestamp --log-level info:info &
            
            # Wait a few seconds for Appium to initialize fully
            sleep 10
            
            echo "Running Appium Tests..."
            export TMD_APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            echo "Using APK: $TMD_APK_PATH"
            pytest appium_tests/ -v

      - name: Upload Gradle Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
          retention-days: 14

      - name: Upload Appium Excel Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: appium_tests/reports/
          retention-days: 14
